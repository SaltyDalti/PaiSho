name: Rules tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test Domain rules
        run: dotnet test tests/PaiSho.Rules.Tests/PaiSho.Rules.Tests.csproj --configuration Release --verbosity minimal
